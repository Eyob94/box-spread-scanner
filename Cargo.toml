[package]
name = "ibkr_box_chain"
version = "0.1.0"
edition = "2024"

[[bin]]
path = "./src/bin/chain.rs"
name = "chain"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
eyre = "0.6.14"
parking_lot = "0.12.5"
strum = "0.28.0"
strum_macros = "0.28.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "json",
] }
