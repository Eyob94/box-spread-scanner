[package]
name = "ibkr_box_chain"
version = "0.1.0"
edition = "2024"

[[bin]]
path="./src/bin/chain.rs"
name="chain"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
eyre = "0.6.14"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
